services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxor
      POSTGRES_USER: igorkaliel
      POSTGRES_PASSWORD: fluxor123
    ports:
      - "5432:5432"
    volumes:
      - fluxor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igorkaliel -d fluxor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fluxor_postgres_data:
